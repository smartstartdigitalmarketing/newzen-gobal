<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="accentGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056B3"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Conveyor Belt -->
  <rect x="100" y="340" width="600" height="40" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="360" r="14" fill="#1E293B"/>
  <circle cx="680" cy="360" r="14" fill="#1E293B"/>
  <line x1="100" y1="380" x2="700" y2="380" stroke="#1E293B" stroke-width="6"/>

  <!-- Inspection Parts on Conveyor -->
  <rect x="180" y="290" width="60" height="50" rx="4" fill="#64748B"/>
  <rect x="370" y="290" width="60" height="50" rx="4" fill="#64748B" stroke="#10B981" stroke-width="3"/>
  <rect x="560" y="290" width="60" height="50" rx="4" fill="#64748B"/>

  <!-- Inspection Optical Camera Rig -->
  <rect x="380" y="100" width="40" height="140" fill="#1E293B" stroke="#0056B3" stroke-width="2"/>
  <circle cx="400" cy="240" r="25" fill="#0F172A" stroke="#0080FF" stroke-width="4"/>
  <circle cx="400" cy="240" r="12" fill="#60A5FA"/>

  <!-- Laser Scanning Cone -->
  <polygon points="400,265 330,340 470,340" fill="rgba(16,185,129,0.25)" stroke="#10B981" stroke-dasharray="4,4"/>

  <!-- PASS Badge Overlay on Inspected Part -->
  <rect x="370" y="260" width="60" height="22" rx="3" fill="#10B981"/>
  <text x="400" y="276" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PASS ✓</text>

  <!-- Title Badge Overlay -->
  <rect x="240" y="515" width="320" height="36" rx="4" fill="url(#accentGrad4)"/>
  <text x="400" y="538" font-family="'Roboto', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="1">INTEGRATED INSPECTION SYSTEMS</text>
</svg>
