<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056B3"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M 0 100 H 800 M 0 200 H 800 M 0 300 H 800 M 0 400 H 800 M 0 500 H 800"/>
    <path d="M 100 0 V 600 M 200 0 V 600 M 300 0 V 600 M 400 0 V 600 M 500 0 V 600 M 600 0 V 600 M 700 0 V 600"/>
  </g>

  <!-- PLC Controller Rack -->
  <rect x="180" y="100" width="440" height="380" rx="8" fill="#1E293B" stroke="#475569" stroke-width="4"/>

  <!-- CPU Module -->
  <g transform="translate(200, 120)">
    <rect x="0" y="0" width="80" height="340" rx="4" fill="#0F172A" stroke="#0056B3" stroke-width="3"/>
    <text x="40" y="30" font-family="sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle" font-weight="bold">CPU 1516</text>
    <!-- Run / Stop LEDs -->
    <circle cx="25" cy="60" r="6" fill="#10B981"/>
    <text x="40" y="64" font-family="sans-serif" font-size="10" fill="#CBD5E1">RUN</text>
    <circle cx="25" cy="80" r="6" fill="#F59E0B"/>
    <text x="40" y="84" font-family="sans-serif" font-size="10" fill="#CBD5E1">STOP</text>
    <circle cx="25" cy="100" r="6" fill="#EF4444"/>
    <text x="40" y="104" font-family="sans-serif" font-size="10" fill="#CBD5E1">ERROR</text>
    <!-- Display Screen -->
    <rect x="10" y="130" width="60" height="40" rx="2" fill="#000" stroke="#475569"/>
    <text x="40" y="154" font-family="monospace" font-size="11" fill="#10B981" text-anchor="middle">ONLINE</text>
    <!-- Ethernet Port -->
    <rect x="25" y="240" width="30" height="30" fill="#334155" stroke="#94A3B8"/>
  </g>

  <!-- Digital Input Modules -->
  <g transform="translate(290, 120)">
    <rect x="0" y="0" width="60" height="340" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="30" y="25" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">DI 32x24V</text>
    <!-- Signal LEDs -->
    <circle cx="20" cy="50" r="3" fill="#10B981"/><circle cx="40" cy="50" r="3" fill="#10B981"/>
    <circle cx="20" cy="65" r="3" fill="#10B981"/><circle cx="40" cy="65" r="3" fill="#334155"/>
    <circle cx="20" cy="80" r="3" fill="#10B981"/><circle cx="40" cy="80" r="3" fill="#10B981"/>
    <circle cx="20" cy="95" r="3" fill="#334155"/><circle cx="40" cy="95" r="3" fill="#10B981"/>
    <circle cx="20" cy="110" r="3" fill="#10B981"/><circle cx="40" cy="110" r="3" fill="#10B981"/>
    <circle cx="20" cy="125" r="3" fill="#10B981"/><circle cx="40" cy="125" r="3" fill="#334155"/>
  </g>

  <!-- Digital Output Modules -->
  <g transform="translate(360, 120)">
    <rect x="0" y="0" width="60" height="340" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="30" y="25" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">DQ 32x24V</text>
    <circle cx="20" cy="50" r="3" fill="#10B981"/><circle cx="40" cy="50" r="3" fill="#10B981"/>
    <circle cx="20" cy="65" r="3" fill="#10B981"/><circle cx="40" cy="65" r="3" fill="#10B981"/>
    <circle cx="20" cy="80" r="3" fill="#334155"/><circle cx="40" cy="80" r="3" fill="#10B981"/>
    <circle cx="20" cy="95" r="3" fill="#10B981"/><circle cx="40" cy="95" r="3" fill="#10B981"/>
  </g>

  <!-- Analog Input Modules -->
  <g transform="translate(430, 120)">
    <rect x="0" y="0" width="60" height="340" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="30" y="25" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">AI 8xU/I</text>
    <circle cx="30" cy="60" r="4" fill="#60A5FA"/>
    <circle cx="30" cy="85" r="4" fill="#60A5FA"/>
    <circle cx="30" cy="110" r="4" fill="#60A5FA"/>
  </g>

  <!-- Communication / PROFINET Module -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="100" height="340" rx="4" fill="#0F172A" stroke="#0056B3" stroke-width="2"/>
    <text x="50" y="25" font-family="sans-serif" font-size="10" fill="#60A5FA" text-anchor="middle" font-weight="bold">PROFINET IO</text>
    <rect x="25" y="60" width="50" height="40" rx="2" fill="#1E293B" stroke="#475569"/>
    <rect x="25" y="120" width="50" height="40" rx="2" fill="#1E293B" stroke="#475569"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="240" y="515" width="320" height="36" rx="4" fill="url(#accentGrad2)"/>
  <text x="400" y="538" font-family="'Roboto', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="1">INTEGRATED CONTROL SYSTEMS</text>
</svg>
